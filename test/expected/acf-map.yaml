project: fixture
generated_by: proposal/scan/scan.js (制約語彙版・推測なし)
common:
  - id: header
    fields: []
  - id: footer
    fields:
      - element: p
        field_name: footer_copyright
        tab: section
        type: textarea
        default: © 2026 アーバンネイチャー北九州
pages:
  - id: contact
    title: お問合せ | アーバンネイチャー北九州
    file: contact.html
    page_type: page
    page_id: contact
    css:
      - css/base.css
      - css/page/contact.css
    sections:
      - id: contact_form
        fields:
          - element: h1
            field_name: hero_title
            tab: section
            type: text
            default: お問合せ
          - element: p
            field_name: hero_lead
            tab: section
            type: textarea
            default: 下記フォームよりお問い合わせください。
    nav:
      - location: global
        links:
          - text: トップ
            href: index.html
          - text: お問合せ
            href: contact.html
    forms:
      - id: contact
        fields:
          - name: your-name
            tag: input
            type: text
            required: true
            placeholder: お名前
          - name: your-email
            tag: input
            type: email
            required: true
            placeholder: メールアドレス
          - name: your-message
            tag: textarea
            type: textarea
            required: true
            placeholder: お問い合わせ内容
          - name: privacy
            tag: input
            type: checkbox
            required: true
            placeholder: ''
    decoration: []
    meta:
      title: お問合せ | アーバンネイチャー北九州
      description: アーバンネイチャー北九州へのお問合せ
  - id: index
    title: アーバンネイチャー北九州
    file: index.html
    page_type: front
    css:
      - css/base.css
      - css/page/front.css
    sections:
      - id: hero
        fields:
          - element: h1
            field_name: hero_title
            tab: section
            type: text
            default: 北九州の自然と暮らす
          - element: p
            field_name: hero_lead
            tab: section
            type: textarea
            default: ネイチャーポジティブを地域から進めます。
          - element: img
            field_name: hero_image
            tab: section
            type: image
            default: images/hero.jpg
            alt: 北九州の自然
      - id: spots
        fields:
          - element: h2
            field_name: spots_title
            tab: section
            type: text
            default: 自然スポット
          - element: img
            field_name: hero_image
            tab: section
            type: image
            default: images/spot.jpg
            alt: 平尾台の草原
          - element: h3
            field_name: hero_title
            tab: section
            type: text
            default: 平尾台
    loops:
      - cpt: spot
        order: date_desc
        count: 3
        repeat: 1
        item_fields:
          - hero_image
          - hero_title
    nav:
      - location: global
        links:
          - text: トップ
            href: index.html
          - text: お問合せ
            href: contact.html
    forms: []
    decoration:
      - selector: div.bg-overlay
        reason: data-deco
    meta:
      title: アーバンネイチャー北九州
      description: 北九州の自然と暮らすためのネイチャーポジティブ・サイト
  - id: spot
    title: 平尾台 | アーバンネイチャー北九州
    file: spot.html
    page_type: single
    cpt: spot
    css:
      - css/base.css
      - css/page/spot.css
    sections:
      - id: detail
        fields:
          - element: img
            field_name: hero_image
            tab: section
            type: image
            default: images/spot.jpg
            alt: 平尾台の草原
          - element: h1
            field_name: hero_title
            tab: section
            type: text
            default: 平尾台
          - element: p
            field_name: hero_lead
            tab: section
            type: textarea
            default: 九州最大のカルスト台地。
          - element: div
            field_name: overview_body
            tab: section
            type: wysiwyg
            default: <p>石灰岩の羊群原が広がり、季節ごとに異なる野草が見られます。</p>
    nav:
      - location: global
        links:
          - text: トップ
            href: index.html
          - text: お問合せ
            href: contact.html
    forms: []
    decoration: []
    meta:
      title: 平尾台 | アーバンネイチャー北九州
      description: カルスト台地・平尾台の自然
