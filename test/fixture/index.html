<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>アーバンネイチャー北九州</title>
  <meta name="description" content="北九州の自然と暮らすためのネイチャーポジティブ・サイト">
  <meta property="og:title" content="アーバンネイチャー北九州">
  <meta property="og:image" content="images/ogp.jpg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/page/front.css">
</head>
<body data-page="front">
  <header data-common="header">
    <nav data-nav="global" data-nav-current="active">
      <a href="index.html" class="active">トップ</a>
      <a href="contact.html">お問合せ</a>
    </nav>
  </header>

  <main id="main-content">
    <section id="hero" class="hero" data-section="hero">
      <div class="bg-overlay" data-deco aria-hidden="true"></div>
      <h1 data-acf="hero_title">北九州の自然と暮らす</h1>
      <p data-acf="hero_lead">ネイチャーポジティブを地域から進めます。</p>
      <img class="hero-image" data-acf="hero_image" src="images/hero.jpg" alt="北九州の自然" width="1200" height="600">
    </section>

    <section class="spots" data-section="spots">
      <h2 data-acf="spots_title">自然スポット</h2>
      <div class="spot-list" data-loop="spot" data-loop-count="3">
        <article data-loop-item>
          <a href="spot.html">
          <img data-acf="hero_image" src="images/spot.jpg" alt="平尾台の草原" width="400" height="300">
          <h3 data-acf="hero_title">平尾台</h3></a>
        </article>
        <article data-loop-sample>
          <img src="images/spot.jpg" alt="曽根干潟" width="400" height="300">
          <h3>曽根干潟</h3>
        </article>
      </div>
    </section>
  </main>

  <footer data-common="footer">
    <p data-acf="footer_copyright">&copy; 2026 アーバンネイチャー北九州</p>
  </footer>
</body>
</html>
