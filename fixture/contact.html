<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>お問合せ｜アーバンネイチャー北九州</title>
  <meta name="description" content="お問合せフォーム">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="global-nav">
    <a href="index.html">トップ</a>
    <a href="about.html">活動について</a>
    <a href="contact.html">お問合せ</a>
  </nav>

  <!-- T3テスト: section祖先なし → パス3でクラス名から page_header -->
  <div class="page-header">
    <h1>お問合せページ</h1>
    <p>お気軽にご連絡ください。</p>
  </div>

  <!-- T3テスト: id が特殊文字のみ（x になるケース）→ section_N -->
  <section id="---">
    <h2>よくあるご質問</h2>
  </section>

  <section id="contact" class="contact">
    <h1>お問合せ</h1>
    <p>下記フォームよりお問い合わせください。</p>
    <form action="/submit" method="post">
      <input type="text" name="your-name" placeholder="お名前">
      <input type="email" name="your-email" placeholder="メールアドレス">
      <textarea name="your-message" placeholder="お問い合わせ内容"></textarea>
      <button type="submit">送信する</button>
    </form>
  </section>

  <footer>
    <p>© Urban Nature Kitakyushu</p>
  </footer>
</body>
</html>
